name: One-shot runtime media notification fix

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-runtime-media-notification.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch runtime media notification flow
        shell: bash
        run: |
          cat > lib/core/services/local_audio_handler.dart <<'DART'
          import 'dart:async';

          import 'package:audio_service/audio_service.dart';
          import 'package:just_audio/just_audio.dart';

          class LocalAudioHandler extends BaseAudioHandler with SeekHandler {
            LocalAudioHandler(
              this.player, {
              required this.loadArtwork,
            }) {
              // audio_service'in önerdiği tek kaynaklı durum akışı:
              // Android medya oturumu/bildirimi doğrudan gerçek player durumunu alır.
              player.playbackEventStream
                  .map<PlaybackState>(_transformEvent)
                  .pipe(playbackState);

              player.sequenceStateStream.listen(_publishSequence);

              // Bazı Android cihazlarında sıra aynı kalırken yalnızca aktif indeks
              // değişebilir. Metadata'yı ayrıca güncelleyerek kilit ekranını canlı tut.
              player.currentIndexStream.listen((_) {
                publishCurrentMediaItem();
              });

              player.errorStream.listen((PlayerException error) {
                playbackState.add(
                  playbackState.value.copyWith(
                    playing: false,
                    processingState: AudioProcessingState.error,
                    errorCode: error.code,
                    errorMessage: error.message,
                  ),
                );
              });
            }

            final AudioPlayer player;

            final Future<Uri?> Function(MediaItem item) loadArtwork;

            PlaybackState _transformEvent(PlaybackEvent event) {
              return PlaybackState(
                controls: <MediaControl>[
                  MediaControl.skipToPrevious,
                  player.playing ? MediaControl.pause : MediaControl.play,
                  MediaControl.skipToNext,
                  MediaControl.stop,
                ],
                systemActions: const <MediaAction>{
                  MediaAction.seek,
                  MediaAction.seekForward,
                  MediaAction.seekBackward,
                },
                androidCompactActionIndices: const <int>[0, 1, 2],
                processingState: switch (player.processingState) {
                  ProcessingState.idle => AudioProcessingState.idle,
                  ProcessingState.loading => AudioProcessingState.loading,
                  ProcessingState.buffering => AudioProcessingState.buffering,
                  ProcessingState.ready => AudioProcessingState.ready,
                  ProcessingState.completed => AudioProcessingState.completed,
                },
                playing: player.playing,
                updatePosition: player.position,
                bufferedPosition: player.bufferedPosition,
                speed: player.speed,
                queueIndex: event.currentIndex,
                repeatMode: switch (player.loopMode) {
                  LoopMode.off => AudioServiceRepeatMode.none,
                  LoopMode.one => AudioServiceRepeatMode.one,
                  LoopMode.all => AudioServiceRepeatMode.all,
                },
                shuffleMode: player.shuffleModeEnabled
                    ? AudioServiceShuffleMode.all
                    : AudioServiceShuffleMode.none,
              );
            }

            void _publishSequence(SequenceState state) {
              final List<MediaItem> items = state.sequence
                  .map((AudioSource source) => source.tag)
                  .whereType<MediaItem>()
                  .toList(growable: false);

              queue.add(items);

              final Object? tag = state.currentSource?.tag;
              final MediaItem? item = tag is MediaItem ? tag : null;

              if (item == null) {
                return;
              }

              mediaItem.add(item);

              if (item.artUri == null) {
                unawaited(_updateArtwork(item));
              }
            }

            void publishCurrentMediaItem() {
              final SequenceState? state = player.sequenceState;
              if (state != null) {
                _publishSequence(state);
              }
            }

            Future<void> _updateArtwork(MediaItem item) async {
              final Uri? uri = await loadArtwork(item);

              if (uri != null && mediaItem.value?.id == item.id) {
                mediaItem.add(item.copyWith(artUri: uri));
              }
            }

            @override
            Future<void> play() async {
              if (player.processingState == ProcessingState.completed) {
                await player.seek(
                  Duration.zero,
                  index: player.effectiveIndices.isEmpty
                      ? 0
                      : player.effectiveIndices.first,
                );
              }

              // Metadata Android'e playing=true durumundan önce ulaşsın.
              publishCurrentMediaItem();

              // just_audio play Future'ı parça bitene kadar açık kalabildiği için
              // burada await etmiyoruz. playbackEventStream gerçek playing=true
              // durumunu audio_service'e yayınlayacak.
              unawaited(
                player.play().catchError((Object error) {
                  playbackState.add(
                    playbackState.value.copyWith(
                      playing: false,
                      processingState: AudioProcessingState.error,
                      errorMessage: error.toString(),
                    ),
                  );
                }),
              );
            }

            @override
            Future<void> pause() async {
              await player.pause();
            }

            @override
            Future<void> stop() async {
              await player.stop();
              await super.stop();
            }

            @override
            Future<void> seek(Duration position) async {
              await player.seek(position);
            }

            @override
            Future<void> skipToNext() async {
              if (!player.hasNext) {
                return;
              }
              await player.seekToNext();
              publishCurrentMediaItem();
            }

            @override
            Future<void> skipToPrevious() async {
              if (player.position.inSeconds > 5 || !player.hasPrevious) {
                await player.seek(Duration.zero);
              } else {
                await player.seekToPrevious();
              }
              publishCurrentMediaItem();
            }

            @override
            Future<void> skipToQueueItem(int index) async {
              if (index < 0 || index >= queue.value.length) {
                return;
              }
              await player.seek(Duration.zero, index: index);
              publishCurrentMediaItem();
            }

            @override
            Future<void> setRepeatMode(
              AudioServiceRepeatMode repeatMode,
            ) async {
              final LoopMode loopMode = switch (repeatMode) {
                AudioServiceRepeatMode.none => LoopMode.off,
                AudioServiceRepeatMode.one => LoopMode.one,
                _ => LoopMode.all,
              };

              await player.setLoopMode(loopMode);
            }

            @override
            Future<void> setShuffleMode(
              AudioServiceShuffleMode shuffleMode,
            ) async {
              final bool enabled =
                  shuffleMode != AudioServiceShuffleMode.none;

              if (enabled) {
                await player.shuffle();
              }

              await player.setShuffleModeEnabled(enabled);
            }
          }
          DART

          python3 - <<'PY'
          from pathlib import Path

          service = Path('lib/core/services/local_music_service.dart')
          text = service.read_text(encoding='utf-8')

          permission_import = "import 'package:permission_handler/permission_handler.dart';\n"
          anchor = "import 'package:path_provider/path_provider.dart';\n"
          if permission_import not in text:
              if anchor not in text:
                  raise SystemExit('path_provider import anchor not found')
              text = text.replace(anchor, anchor + permission_import, 1)

          if "late final LocalAudioHandler _localAudioHandler;" not in text:
              text = text.replace(
                  "  late final AudioHandler _audioHandler;\n",
                  "  late final AudioHandler _audioHandler;\n  late final LocalAudioHandler _localAudioHandler;\n",
                  1,
              )

          old = "    _audioHandler = handler;\n    return handler;"
          new = "    _localAudioHandler = handler;\n    _audioHandler = handler;\n    return handler;"
          if "_localAudioHandler = handler;" not in text:
              if old not in text:
                  raise SystemExit('handler assignment anchor not found')
              text = text.replace(old, new, 1)

          permission_method = '''
  Future<void> _ensureNotificationPermission() async {
    if (!Platform.isAndroid) {
      return;
    }

    try {
      PermissionStatus status = await Permission.notification.status;

      if (status.isDenied) {
        status = await Permission.notification.request();
      }

      if (status.isPermanentlyDenied || status.isRestricted) {
        playbackError =
            'Bildirim izni kapalı. B_music02 medya kontrolünü gösterebilmek için uygulama bildirimlerini Ayarlar’dan açın.';
        notifyListeners();
      }
    } catch (_) {
      // Medya oturumu Android 13+ üzerinde bildirim izninden muaf olabilir;
      // izin sorgusu başarısız olsa da oynatmayı engelleme.
    }
  }

'''
          method_anchor = "  Future<void> playSong(\n"
          if "Future<void> _ensureNotificationPermission()" not in text:
              if method_anchor not in text:
                  raise SystemExit('playSong anchor not found')
              text = text.replace(method_anchor, permission_method + method_anchor, 1)

          old_tail = "    notifyListeners();\n    _startPlaying();\n  }"
          new_tail = "    _localAudioHandler.publishCurrentMediaItem();\n    await _ensureNotificationPermission();\n\n    notifyListeners();\n    _startPlaying();\n  }"
          if "await _ensureNotificationPermission();" not in text:
              if old_tail not in text:
                  raise SystemExit('play selection tail not found')
              text = text.replace(old_tail, new_tail, 1)

          service.write_text(text, encoding='utf-8')

          main = Path('lib/main.dart')
          main_text = main.read_text(encoding='utf-8')
          old_channel = "androidNotificationChannelId: 'com.example.b_music02.audio.playback',"
          new_channel = "androidNotificationChannelId: 'com.example.b_music02.media.playback.v3',"
          if old_channel in main_text:
              main_text = main_text.replace(old_channel, new_channel, 1)
          elif new_channel not in main_text:
              raise SystemExit('notification channel anchor not found')

          name_line = "      androidNotificationChannelName: 'B_music02 Müzik',\n"
          desc_line = "      androidNotificationChannelDescription:\n          'Çalan müzik ve kilit ekranı medya kontrolleri',\n"
          if 'androidNotificationChannelDescription:' not in main_text:
              if name_line not in main_text:
                  raise SystemExit('channel name anchor not found')
              main_text = main_text.replace(name_line, name_line + desc_line, 1)

          main.write_text(main_text, encoding='utf-8')
          PY

      - name: Validate patch
        shell: bash
        run: |
          grep -q "playbackEventStream" lib/core/services/local_audio_handler.dart
          grep -q "publishCurrentMediaItem" lib/core/services/local_audio_handler.dart
          grep -q "Permission.notification.request" lib/core/services/local_music_service.dart
          grep -q "media.playback.v3" lib/main.dart
          ! grep -q "forcePlaying" lib/core/services/local_audio_handler.dart

      - name: Commit fix and remove one-shot workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-runtime-media-notification.yml
          git add lib/core/services/local_audio_handler.dart lib/core/services/local_music_service.dart lib/main.dart
          git diff --cached --check
          git commit -m 'fix: stabilize Android media session notification'
          git push origin HEAD:main
