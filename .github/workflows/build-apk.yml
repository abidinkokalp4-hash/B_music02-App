name: B_music02 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümünü göster
        run: flutter --version

      - name: Android klasörü yoksa oluştur
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Paketleri yükle
        run: flutter pub get

      - name: Android müzik ve arka plan ayarlarını yap
        run: |
          python3 <<'PY'
          from pathlib import Path

          manifest_path = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest_path.read_text(
              encoding="utf-8"
          )

          # tools namespace
          if 'xmlns:tools=' not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android"\n'
                  '    xmlns:tools="http://schemas.android.com/tools">'
              )

          additions = []

          # İnternet
          if "android.permission.INTERNET" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.INTERNET"/>'
              )

          # Arka plan müzik
          if "android.permission.WAKE_LOCK" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.WAKE_LOCK"/>'
              )

          if "android.permission.FOREGROUND_SERVICE" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.FOREGROUND_SERVICE"/>'
              )

          if "android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PLAYBACK"/>'
              )

          # Android 13 ve üzeri:
          # telefondaki müzik/ses dosyalarını okuma
          if "android.permission.READ_MEDIA_AUDIO" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.READ_MEDIA_AUDIO"/>'
              )

          # Android 12 ve altı
          if "android.permission.READ_EXTERNAL_STORAGE" not in text:
              additions.append(
                  '    <uses-permission '
                  'android:name="android.permission.READ_EXTERNAL_STORAGE" '
                  'android:maxSdkVersion="32"/>'
              )

          if additions:
              manifest_end = text.find(">")

              text = (
                  text[:manifest_end + 1]
                  + "\n"
                  + "\n".join(additions)
                  + "\n"
                  + text[manifest_end + 1:]
              )

          # Flutter MainActivity yerine AudioServiceActivity
          text = text.replace(
              'android:name=".MainActivity"',
              'android:name="com.ryanheise.audioservice.AudioServiceActivity"'
          )

          text = text.replace(
              'android:name="com.example.b_music02.MainActivity"',
              'android:name="com.ryanheise.audioservice.AudioServiceActivity"'
          )

          service_xml = '''
                  <service
                      android:name="com.ryanheise.audioservice.AudioService"
                      android:foregroundServiceType="mediaPlayback"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.media.browse.MediaBrowserService" />
                      </intent-filter>
                  </service>

                  <receiver
                      android:name="com.ryanheise.audioservice.MediaButtonReceiver"
                      android:exported="true"
                      tools:ignore="Instantiatable">
                      <intent-filter>
                          <action android:name="android.intent.action.MEDIA_BUTTON" />
                      </intent-filter>
                  </receiver>
          '''

          if "com.ryanheise.audioservice.AudioService" not in text:
              text = text.replace(
                  "    </application>",
                  service_xml + "\n    </application>"
              )

          manifest_path.write_text(
              text,
              encoding="utf-8"
          )

          print("----- AndroidManifest.xml -----")
          print(text)
          PY

      - name: Uygulama ikonlarını oluştur
        run: dart run flutter_launcher_icons

      - name: Release APK oluştur
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"

      - name: APK dosyasını kontrol et
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
