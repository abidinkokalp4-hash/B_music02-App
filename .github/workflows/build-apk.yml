name: B_music02 APK Build

on:
  workflow_dispatch:
  push:
    branches: [main, local-media-redesign, feature/local-media-complete]
  pull_request:
    branches: [main]

permissions:
  contents: read
  actions: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    if: "!contains(github.event.head_commit.message, '[reuse-apk]')"
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Java kur
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle önbelleğini hazırla
        uses: gradle/actions/setup-gradle@v4
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Android projesini hazırla
        run: |
          if [ ! -d android ]; then
            cp pubspec.lock /tmp/b_music02-pubspec.lock
            flutter create --platforms=android --org com.example --project-name b_music02 --no-pub .
            cp /tmp/b_music02-pubspec.lock pubspec.lock
            rm -f test/widget_test.dart
          fi
          flutter pub get
          python3 tool/configure_android.py
      - name: Android yapılandırma testleri
        run: |
          python3 -m py_compile tool/verify_android_media.py
          python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Dart analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Medya durumu regresyon testleri
        env:
          BMUSIC_CAPTURE_DIR: ui-evidence
        run: flutter test
      - name: Arayüz görüntülerini kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-UI
          path: ui-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Uygulama ikonlarını oluştur
        run: dart run flutter_launcher_icons
      - name: Release APK oluştur
        run: flutter build apk --release --build-number=${{ github.run_number }}
      - name: APK içeriğini doğrula
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/apk-manifest.xml
          python3 tool/verify_apk_manifest.py /tmp/apk-manifest.xml
          "$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/aapt2" dump resources build/app/outputs/flutter-apk/app-release.apk > /tmp/apk-resources.txt
          python3 tool/verify_apk_resources.py /tmp/apk-resources.txt
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: Bağımlılık kilidini kaydet
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-dependencies
          path: pubspec.lock
          retention-days: 14
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  android-media:
    if: always() && (needs.build.result == 'success' || needs.build.result == 'skipped')
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: B_music02-APK
          path: release
          run-id: ${{ needs.build.result == 'skipped' && '37202258220' || github.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Yerel video test aracını hazırla
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Android sanallaştırmasını aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 medya bildirimini ve kontrollerini dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-build: 12414864
          arch: x86_64
          target: default
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swangle_indirect -feature -Vulkan -camera-back none
          script: python3 tool/verify_android_media.py release/app-release.apk
      - name: Android test kanıtlarını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-Android-media
          path: android-media-evidence/
          if-no-files-found: warn
          retention-days: 14

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, android-media]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: B_music02-APK
          path: release
      - name: Doğrulanmış APK sürümünü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/app-release.apk release/B_music02.apk
          cd release
          sha256sum B_music02.apk > SHA256SUMS.txt
          gh release create "v1.0.${{ github.run_number }}" \
            B_music02.apk SHA256SUMS.txt \
            --target "$GITHUB_SHA" --latest \
            --title "B_music02 1.0 · Build ${{ github.run_number }}" \
            --notes-file ../RELEASE_NOTES.md
