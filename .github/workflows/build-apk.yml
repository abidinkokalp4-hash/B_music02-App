name: B_music02 APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Kodu al
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter sürümünü göster
        run: flutter --version

      - name: Android klasörü yoksa oluştur
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      - name: Paketleri yükle
        run: flutter pub get

      - name: İnternet iznini kontrol et
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"

          if ! grep -q "android.permission.INTERNET" "$MANIFEST"; then
            sed -i '/<manifest/a \    <uses-permission android:name="android.permission.INTERNET"/>' "$MANIFEST"
          fi

      - name: Uygulama ikonlarını oluştur
        run: dart run flutter_launcher_icons

      - name: Release APK oluştur
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          flutter build apk --release \
            --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"

      - name: APK dosyasını kontrol et
        run: |
          ls -lh build/app/outputs/flutter-apk/
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
