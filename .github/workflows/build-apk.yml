name: B_music02 APK Build

on:
  push:
    branches: [notification-qa-build264]

permissions:
  contents: read
  actions: read

jobs:
  verify-existing-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v4
      - name: APK kaynak sürümünü doğrula
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          test "$(gh api repos/$GH_REPO/actions/runs/36769122771 --jq '.head_sha')" = "628364cee02c5ed54f1612b5246a6bfc2d7680c8"
          test "$(gh api repos/$GH_REPO/actions/runs/36769122771 --jq '.run_number')" = "264"
          test "$(gh api repos/$GH_REPO/actions/runs/36769122771/jobs --jq '.jobs[] | select(.name == "build") | .conclusion')" = "success"
      - uses: actions/download-artifact@v4
        with:
          name: B_music02-APK
          path: release
          run-id: 36769122771
          github-token: ${{ github.token }}
      - name: APK dosyasının SHA256 özetini doğrula
        run: |
          expected="$(awk '{print $1}' release/SHA256SUMS.txt)"
          actual="$(sha256sum release/app-release.apk | awk '{print $1}')"
          test "$actual" = "$expected"
      - name: Android sanallaştırmasını aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Aynı Build 264 APK dosyasında Android medya kontrollerini dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: default
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          script: python3 tool/verify_android_media.py release/app-release.apk
      - name: Android test kanıtlarını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-Android-media-Build264
          path: android-media-evidence/
          if-no-files-found: warn
          retention-days: 14
      - name: Android üzerinde doğrulanmış Build 264 sürümünü yayınla
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          mv release/app-release.apk release/B_music02.apk
          cd release
          sha256sum B_music02.apk > SHA256SUMS.txt
          gh release create "v1.0.264" B_music02.apk SHA256SUMS.txt \
            --target "628364cee02c5ed54f1612b5246a6bfc2d7680c8" --latest \
            --title "B_music02 1.0 · Build 264" \
            --notes-file ../RELEASE_NOTES.md
