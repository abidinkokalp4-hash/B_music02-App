name: B_music02 APK Olustur

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Android altyapisini hazirla
        run: |
          if [ ! -d "android" ]; then
            flutter create . --platforms=android --project-name=b_music02
          fi

      - name: Internet iznini ekle
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("android/app/src/main/AndroidManifest.xml")
          text = path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET"/>'

          if permission not in text:
              pos = text.find(">")
              text = text[:pos + 1] + "\n    " + permission + text[pos + 1:]
              path.write_text(text)

          print(path.read_text())
          PY

      - name: Paketleri yukle
        run: flutter pub get

      - name: Uygulama simgesini olustur
        run: dart run flutter_launcher_icons
        continue-on-error: true

      - name: APK olustur
        run: flutter build apk --release

      - name: APK yukle
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
