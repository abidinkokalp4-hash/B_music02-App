name: Android 14 verification of signed 1.0.378
on:
  push:
    branches: [qa/media-editing-378]
permissions:
  contents: read
  actions: read
jobs:
  android-media:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: B_music02-APK
          path: release
          run-id: 46104776329
          github-token: ${{ github.token }}
      - name: Verify exact signed test APK
        run: python3 tool/verify_release_signing.py release/app-release.apk
      - name: Download installed-version fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download --repo "${{ github.repository }}" --pattern B_music02.apk --dir previous
      - name: Yerel video test aracını hazırla
        run: command -v ffmpeg || (sudo apt-get update && sudo apt-get install -y ffmpeg)
      - name: Android sanallaştırmasını aç
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Android 14 medya bildirimini ve kontrollerini dene
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          emulator-build: 12414864
          arch: x86_64
          target: default
          cores: 2
          ram-size: 2048M
          disk-size: 2048M
          emulator-boot-timeout: 300
          emulator-options: -no-window -no-snapshot -no-audio -no-boot-anim -gpu swiftshader_indirect -feature -Vulkan -camera-back none
          script: |
            python3 tool/verify_android_media.py release/app-release.apk --video-only
            python3 tool/verify_upgrade.py release/app-release.apk previous/B_music02.apk
      - name: Android test kanıtlarını kaydet
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-Android-media
          path: android-media-evidence/
          if-no-files-found: warn
          retention-days: 14
