name: B_music02 APK Build

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Kodu al
        uses: actions/checkout@v4
      - name: Java kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Flutter kur
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: stable
          cache: true
      - name: Android projesini hazırla
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.example --project-name b_music02 --no-pub .
          fi
          flutter pub get
          python3 tool/configure_android.py
      - name: Android yapılandırma testleri
        run: python3 -m unittest discover -s test -p 'test_*.py' -v
      - name: Dart analizi
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Uygulama ikonlarını oluştur
        run: dart run flutter_launcher_icons
      - name: Release APK oluştur
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          flutter build apk --release --build-number=${{ github.run_number }} \
            --dart-define=YOUTUBE_API_KEY="$YOUTUBE_API_KEY"
      - name: APK içeriğini doğrula
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/cmdline-tools/latest/bin/apkanalyzer" manifest print build/app/outputs/flutter-apk/app-release.apk > /tmp/apk-manifest.xml
          python3 tool/verify_apk_manifest.py /tmp/apk-manifest.xml
          sha256sum build/app/outputs/flutter-apk/app-release.apk > build/app/outputs/flutter-apk/SHA256SUMS.txt
      - name: APK yükle
        uses: actions/upload-artifact@v4
        with:
          name: B_music02-APK
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/flutter-apk/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30
