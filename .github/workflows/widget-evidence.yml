name: Inspect APK 277 notification panel
on:
  push:
    branches: [widget-evidence]
permissions:
  actions: read
  contents: read
jobs:
  evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: B_music02-Android-media
          run-id: 36802751505
          github-token: ${{ github.token }}
          path: evidence
      - name: Show actual notification screen
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path
          root = Path('evidence')
          for name in ('notification-panel.png', 'home-widget-playing.png'):
              p=root/name
              if p.exists():
                  print('PNG_' + name + ':' + base64.b64encode(p.read_bytes()).decode())
          PY
