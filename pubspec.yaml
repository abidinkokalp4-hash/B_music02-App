name: b_music02
description: B Music yerel müzik ve video oynatıcı
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  shared_preferences: ^2.5.3
  http: ^1.2.2
  media_kit: ^1.2.6
  media_kit_video: ^2.0.1
  media_kit_libs_video: ^1.0.7
  audio_metadata_reader: ^1.8.0
  share_plus: ^12.0.2
  just_audio: ^0.10.6
  audio_service: ^0.18.19
  audio_session: ^0.2.2
  on_audio_query: ^2.9.0
  permission_handler: ^12.0.1
  path_provider: ^2.1.5
  photo_manager: ^3.7.1
  firebase_core: ^4.15.0
  firebase_messaging: ^16.7.0
  firebase_analytics: ^12.6.0
  firebase_crashlytics: ^5.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/b_music02_logo.png

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/images/b_music02_logo.png
  adaptive_icon_background: '#0B0B0B'
  adaptive_icon_foreground: assets/images/b_music02_logo.png